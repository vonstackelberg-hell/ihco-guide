<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>IHCO Star Map</title>
    <link rel="stylesheet" href="ihco_map.css">
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="search-wrap">
        <input id="search" type="text" placeholder="System suchen..." autocomplete="off">
        <div id="autocomplete"></div>
    </div>

    <div id="tooltip">
        HITCHHIKER'S GUIDE TO THE [IHCO] GALAXY<br>
        <span id="count" style="color:#33ff3388">Lade Systeme...</span>
    </div>

    <div id="hover"></div>

    <div id="info">
        🖱 Drehen: Linksklick + Ziehen<br>
        🖱 Zoom: Scrollrad<br>
        🖱 Verschieben: Rechtsklick + Ziehen<br>
        ● Grün = kontrolliert &nbsp; ● Blau = präsent
    </div>

    <div id="toggles">
        <button class="toggle-btn" id="btnControlled" onclick="toggleGroup('controlled')">● Kontrolliert</button>
        <button class="toggle-btn" id="btnPresent"    onclick="toggleGroup('present')">● Präsent</button>
		<button class="toggle-btn" id="btnGrid"       onclick="toggleGroup('grid')">⊞ Grid</button>
    </div>

    <div id="panic">DON'T PANIC</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<script src="ihco_config.js"></script>
	<script src="stars.js"></script>
    <script src="ihco_map.js"></script>
</body>
</html>
