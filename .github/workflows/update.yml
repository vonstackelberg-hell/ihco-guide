name: Wöchentliches Daten-Update

on:
  schedule:
    - cron: '0 6 * * 2'  # Jeden Dienstag 06:00 UTC
  workflow_dispatch:       # Manuell auslösbar

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Datenverzeichnis erstellen
        run: mkdir -p data

      - name: factions.json.gz herunterladen
        run: curl -L -o data/factions.json.gz https://downloads.spansh.co.uk/factions.json.gz

      - name: systems_1week.json.gz herunterladen
        run: curl -L -o data/systems_1week.json.gz https://downloads.spansh.co.uk/systems_1week.json.gz

      - name: ihco_filter.py ausführen
        run: python py/ihco_filter.py

      - name: ihco_systems.json committen
        run: |
          git config user.name "IHCO Autopilot"
          git config user.email "actions@github.com"
          git add ihco_systems.json
          git diff --staged --quiet || git commit -m "🤖 Daten-Update $(date +'%Y-%m-%d')"
          git push
